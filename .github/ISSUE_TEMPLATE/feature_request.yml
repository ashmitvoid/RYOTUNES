name: Feature request
description: Propose a change that improves the listening or Ryoku desktop experience
title: "[Request] "
labels: ["enhancement"]
body:
  - type: textarea
    id: usecase
    attributes:
      label: What problem would this solve?
      description: Start with the user problem rather than the implementation.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behaviour
      description: Explain how you would expect it to work in Ryotunes.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Mockups, comparable behaviour in another app, or constraints that matter.
