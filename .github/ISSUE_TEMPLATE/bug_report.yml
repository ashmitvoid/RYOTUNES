name: Bug report
description: Something in Ryotunes is broken or behaves unexpectedly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. A few environment details usually make Linux/WebKit issues much faster to reproduce.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you did, what you expected and what happened instead.
      placeholder: "After closing to tray and reopening…"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Play …
        3. Close …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ryotunes version
      placeholder: "2.2.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distro, desktop/shell, display server and GPU if relevant.
      placeholder: "Ryoku on CachyOS, Hyprland/Wayland, AMD iGPU + NVIDIA dGPU"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / logs
      description: Paste relevant output from ryotunes-diagnostics or attach a log. Remove anything private first.
      render: shell
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recording
      description: Drag screenshots or a short screen recording here when the issue is visual.
