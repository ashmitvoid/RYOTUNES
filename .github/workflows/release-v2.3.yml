name: Publish v2.3 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release Ryotunes v2.3.0')
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel

    steps:
      - name: Bootstrap checkout runtime
        run: |
          pacman -Syu --noconfirm --needed git nodejs ca-certificates

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Arch build dependencies
        run: |
          pacman -S --noconfirm --needed             rustup pnpm python libarchive zstd zip github-cli             webkit2gtk-4.1 libappindicator-gtk3 mpv openssl librsvg             desktop-file-utils hicolor-icon-theme xdg-utils             appmenu-gtk-module xdotool

      - name: Prepare unprivileged builder
        run: |
          id builder >/dev/null 2>&1 || useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          echo "BUILDER_HOME=$(getent passwd builder | cut -d: -f6)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain and Tauri CLI
        run: |
          runuser -u builder -- env HOME="$BUILDER_HOME" bash -lc '
            rustup default stable
            rustup component add rustfmt
            cargo install tauri-cli --locked --version "^2"
          '

      - name: Install frontend dependencies
        run: |
          runuser -u builder -- env HOME="$BUILDER_HOME" PATH="$BUILDER_HOME/.cargo/bin:/usr/bin" bash -lc "
            cd '$GITHUB_WORKSPACE/ui'
            pnpm install --frozen-lockfile
          "

      - name: Validate v2.3 source
        run: |
          runuser -u builder -- env HOME="$BUILDER_HOME" PATH="$BUILDER_HOME/.cargo/bin:/usr/bin" bash -lc "
            cd '$GITHUB_WORKSPACE'
            cargo fmt --all
            RYOTUNES_STATIC_ONLY=1 ./scripts/release-check.sh
            cd ui
            pnpm check
            pnpm build
            cd ..
            cargo fetch --locked
            CARGO_NET_OFFLINE=true cargo test --workspace --locked --offline
            CARGO_NET_OFFLINE=true cargo check --workspace --locked --offline
          "

      - name: Build native release binaries
        run: |
          runuser -u builder -- env HOME="$BUILDER_HOME" PATH="$BUILDER_HOME/.cargo/bin:/usr/bin" CARGO_NET_OFFLINE=true bash -lc "
            cd '$GITHUB_WORKSPACE'
            cargo tauri build --no-bundle
            cargo build --release --locked --offline --package sync-server
            test -x target/release/ryotunes
            test -x target/release/ryotunes-sync
          "

      - name: Build release assets
        run: |
          runuser -u builder -- env HOME="$BUILDER_HOME" PATH="$BUILDER_HOME/.cargo/bin:/usr/bin" bash -lc "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            chmod +x scripts/build-replacement-package.sh scripts/make-source-release.sh scripts/release-check.sh scripts/ryoku-window-rule.sh
            rm -rf dist
            mkdir -p dist
            ./scripts/build-replacement-package.sh dist
            RYOTUNES_STATIC_ONLY=1 ./scripts/make-source-release.sh dist/ryotunes-v2.3.0-final-source.tar.gz
            cd dist
            sha256sum ryotunes-v2.3.0-final-source.tar.gz >> SHA256SUMS-v2.3.0.txt
            sort -u SHA256SUMS-v2.3.0.txt -o SHA256SUMS-v2.3.0.txt
          "

      - name: Inspect release assets
        run: |
          ls -lh dist
          cat dist/SHA256SUMS-v2.3.0.txt
          bsdtar -tf dist/ryotunes-v2.3-2.3.0-1-x86_64.pkg.tar.zst | grep -E 'usr/(bin|lib|share)' | head -80

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/ryotunes-v2.3-2.3.0-1-x86_64.pkg.tar.zst
            dist/Ryotunes-v2.3-Ryoku-x86_64.zip
            dist/ryotunes-v2.3.0-linux-x86_64.tar.zst
            dist/ryotunes-v2.3.0-final-source.tar.gz
            dist/SHA256SUMS-v2.3.0.txt
          )
          if gh release view v2.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v2.3.0 "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v2.3.0               --title "Ryotunes v2.3.0"               --notes-file RELEASE_NOTES.md               --latest               --repo "$GITHUB_REPOSITORY"
          else
            gh release create v2.3.0 "${assets[@]}"               --target "$GITHUB_SHA"               --title "Ryotunes v2.3.0"               --notes-file RELEASE_NOTES.md               --latest               --repo "$GITHUB_REPOSITORY"
          fi
