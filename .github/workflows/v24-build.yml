name: Build v2.4 binaries

on:
  push:
    branches:
      - v2.4
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libmpv-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Frontend validation
        working-directory: ui
        run: pnpm check && pnpm build

      - name: Normalize Rust formatting in build workspace
        run: cargo fmt --all

      - name: Static release guards
        env:
          RYOTUNES_STATIC_ONLY: "1"
        run: ./scripts/release-check.sh

      - name: Verify frozen dependency graph
        run: cargo fetch --locked

      - name: Rust tests and check
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo test --workspace --locked --offline
          cargo check --workspace --locked --offline

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      - name: Build Ryotunes
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo tauri build --no-bundle

      - name: Build sync helper
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo build --release --locked --offline --package sync-server

      - name: Verify binaries
        run: |
          test -x target/release/ryotunes
          test -x target/release/ryotunes-sync
          file target/release/ryotunes
          file target/release/ryotunes-sync
          sha256sum target/release/ryotunes target/release/ryotunes-sync > v2.4-binary-SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ryotunes-v2.4-linux-x86_64-binaries
          path: |
            target/release/ryotunes
            target/release/ryotunes-sync
            v2.4-binary-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
